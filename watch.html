<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer view — Nossonk LLC</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .log { list-style: none; padding: 0; margin: 1rem 0 0; max-height: 280px; overflow: auto; border-top: 1px solid var(--line, #ddd); }
    .log li { display: flex; justify-content: space-between; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--line, #ddd); font-size: .9rem; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="logo" href="index.html"><img src="assets/logo.jpg" alt="Nossonk LLC" /></a>
    <span class="role">Customer view</span>
    <a class="phone" href="tel:+19452395974">(945) 239-5974</a>
  </header>
  <section class="track-layout">
    <div>
      <p class="kicker" id="jobTitle">Customer view</p>
      <h1>Live map of the walking phone.</h1>
      <div class="facts slim">
        <div><b id="statHouse">0</b><span>houses</span></div>
        <div><b id="statApt">0</b><span>apartments</span></div>
        <div><b id="statDone">0</b><span>total</span></div>
      </div>
      <div class="meter"><i id="meterFill"></i></div>
      <p class="fine" id="statPct">Waiting for live GPS from the crew phone.</p>
      <h3>Hung so far</h3>
      <ul class="log" id="logList"></ul>
    </div>
    <div class="map-pane tall"><div id="watchMap" style="height:70vh;min-height:360px"></div></div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="data.js"></script>
  <script src="live.js"></script>
  <script src="maps-v3.js?v=5"></script>
  <script src="map.js"></script>
  <script src="watch.js?v=5"></script>
</body>
</html>
