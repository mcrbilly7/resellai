<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew tracker — Nossonk LLC</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <a class="logo" href="index.html"><img src="assets/logo.jpg" alt="Nossonk LLC" /></a>
    <span class="role">Crew tracker</span>
    <a class="phone" href="watch.html" id="toCustomer">Customer view</a>
  </header>
  <section class="track-layout">
    <div>
      <p class="kicker" id="jobTitle">No job loaded</p>
      <h1>Walk with precise location on.</h1>
      <div id="permGate" class="gate">
        <p>This page is for the hanger. Tap below and choose <b>Allow</b> plus <b>precise location</b> so the trail follows the block.</p>
        <button class="btn navy" type="button" id="allowGps">Allow precise location</button>
      </div>
      <div id="livePanel" hidden>
        <div class="facts slim">
          <div><b id="statDone">0</b><span>hung</span></div>
          <div><b id="statGoal">—</b><span>job</span></div>
          <div><b id="statTime">00:00</b><span>time</span></div>
        </div>
        <div class="meter"><i id="meterFill"></i></div>
        <p class="fine" id="statPct">0%</p>
        <label>Log doors <input id="inc" type="number" value="25" min="1" /></label>
        <div class="hero-row">
          <button class="btn navy" type="button" id="logDoors">Add to count</button>
          <button class="btn" type="button" id="stopGps">Stop GPS</button>
          <button class="btn" type="button" id="shareLink">Copy updated customer link</button>
        </div>
      </div>
      <p class="fine" id="gpsStatus">GPS stays off until you allow it.</p>
    </div>
    <div class="map-pane tall"><svg id="trackMap" role="img" aria-label="Crew map"></svg></div>
  </section>
  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="track.js"></script>
</body>
</html>
