<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crew tracker — Nossonk LLC</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .tap { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: 1rem 0; }
    .tap button { min-height: 64px; font-size: 1.05rem; }
    .log { list-style: none; padding: 0; margin: 1rem 0 0; max-height: 280px; overflow: auto; border-top: 1px solid var(--line, #ddd); }
    .log li { display: flex; justify-content: space-between; gap: .6rem; padding: .45rem 0; border-bottom: 1px solid var(--line, #ddd); font-size: .9rem; }
    .log b { text-transform: capitalize; }
  </style>
</head>
<body>
  <header class="bar">
    <a class="logo" href="index.html"><img src="assets/logo.jpg" alt="Nossonk LLC" /></a>
    <span class="role">Crew tracker</span>
    <a class="phone" href="watch.html" id="toCustomer">Customer view</a>
  </header>
  <section class="track-layout">
    <div>
      <p class="kicker" id="jobTitle">Crew tracker</p>
      <h1>Tap house or apartment as you hang.</h1>
      <div id="permGate" class="gate">
        <p>Optional: allow precise location so the map follows you.</p>
        <button class="btn navy" type="button" id="allowGps">Allow precise location</button>
      </div>
      <div id="livePanel">
        <div class="facts slim">
          <div><b id="statHouse">0</b><span>houses</span></div>
          <div><b id="statApt">0</b><span>apartments</span></div>
          <div><b id="statDone">0</b><span>total hung</span></div>
        </div>
        <div class="meter"><i id="meterFill"></i></div>
        <p class="fine" id="statPct">0% of booked doors</p>
        <label>Doors this tap <input id="inc" type="number" value="1" min="1" /></label>
        <div class="tap">
          <button class="btn navy" type="button" id="logHouse">House</button>
          <button class="btn navy" type="button" id="logApt">Apartment</button>
        </div>
        <div class="hero-row">
          <button class="btn" type="button" id="undoLog">Undo last</button>
          <button class="btn" type="button" id="stopGps">Stop GPS</button>
          <button class="btn" type="button" id="shareLink">Copy customer link</button>
        </div>
        <h3>Hung so far</h3>
        <ul class="log" id="logList"></ul>
      </div>
      <p class="fine" id="gpsStatus">List updates the moment you tap House or Apartment.</p>
    </div>
    <div class="map-pane tall"><div id="trackMap" style="height:70vh;min-height:360px"></div></div>
  </section>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="data.js"></script>
  <script src="live.js"></script>
  <script src="maps-v3.js?v=3"></script>
  <script src="map.js"></script>
  <script src="track.js?v=3"></script>
</body>
</html>
