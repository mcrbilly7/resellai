<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Nossonk LLC</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="bar">
    <a class="logo" href="index.html"><img src="assets/logo.jpg" alt="Nossonk LLC" /></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="phone.html">Call</a>
    </nav>
  </header>
  <section class="contact">
    <div>
      <p class="kicker">Email</p>
      <h1>Write Nossonk LLC.</h1>
      <p>This form sends to the shop at <a href="mailto:noskotx@gmail.com">noskotx@gmail.com</a>.</p>
      <p><a class="btn" href="mailto:noskotx@gmail.com">Open mail app instead</a></p>
    </div>
    <form action="https://formsubmit.co/392d527d09be6d2ef7eba61b05686ad0" method="POST">
      <input type="hidden" name="_subject" value="Nossonk LLC website message" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_next" value="https://mcrbilly7.github.io/resellai/thanks.html" />
      <input type="hidden" name="_autoresponse" value="Thank you for writing Nossonk LLC. We received your message and will get back to you within 48 hours. If you need the shop sooner, call or text (945) 239-5974." />
      <label>Name <input name="name" required /></label>
      <label>Phone <input name="phone" type="tel" /></label>
      <label>Your email <input name="email" type="email" required /></label>
      <label>City / doors <input name="job" placeholder="Dallas, 500 houses" /></label>
      <label>Message <textarea name="message" rows="5" required></textarea></label>
      <button class="btn navy" type="submit">Send email</button>
    </form>
  </section>
</body>
</html>
